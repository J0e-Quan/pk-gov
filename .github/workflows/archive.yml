name: Archive Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build 

      - name: Wait for Render deploy to finish
        run: sleep 60 # Wait 1 minute (60s) before archiving

      - name: Archive pages to Internet Archive
        env:
          SITE_URL: "https://pk-gov.onrender.com" 
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          DIST_DIR: "dist"
        run: |
          cd "$DIST_DIR"

          # 1. Collect all rendered HTML file paths
          urls=()
          while IFS= read -r file; do
            clean_path="${file#.}"
            
            # Format canonical URLs for index files vs standard files
            if [[ "$clean_path" == *"/index.html" ]]; then
              clean_path="${clean_path%"index.html"}"
            elif [[ "$clean_path" == "/index.html" ]]; then
              clean_path="/"
            fi
            
            urls+=("${SITE_URL}${clean_path}")
          done < <(find . -type f -name "*.html" -not -path "*/.*")

          echo "Found ${#urls[@]} page(s) to archive."

          # Function to save a URL with enhanced retry/backoff logic
          save_url() {
            local target_url="$1"
            local max_attempts=5
            local attempt=1
            local backoff=60 # Start with a 60s wait when rate/session limited

            while [ $attempt -le $max_attempts ]; do
              echo "Submitting (Attempt $attempt/$max_attempts): $target_url"

              response=$(curl -s -X POST "https://web.archive.org/save/" \
                -H "Accept: application/json" \
                -H "Authorization: LOW $IA_ACCESS_KEY:$IA_SECRET_KEY" \
                -d "url=$target_url" \
                -d "capture_outlinks=0" \
                -d "capture_all=1" \
                -d "js_behavior_timeout=5000")

              if echo "$response" | grep -q '"job_id"'; then
                echo "Successfully queued: $target_url"
                return 0
              else
                echo "API Error for $target_url: $response"
                if [ $attempt -lt $max_attempts ]; then
                  echo "Session/Rate limit reached. Waiting ${backoff}s before retrying..."
                  sleep $backoff
                  backoff=$((backoff * 2)) # Exponential increase (60s, 120s, 240s)
                fi
              fi

              attempt=$((attempt + 1))
            done

            echo "Failed to archive $target_url after $max_attempts attempts."
            return 1
          }

          # 2. Process pages with a safer delay to allow active sessions to finish
          for url in "${urls[@]}"; do
            if ! save_url "$url"; then
              failed_urls+=("$url")
            fi
            
            # Wait 15 seconds between distinct page requests to prevent session overlap
            sleep 15
          done